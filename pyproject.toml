[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-ids"
version = "0.1.0"
description = "Packet-level network intrusion detection system using raw AF_PACKET sockets."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
    "click>=8.0",
    "requests>=2.25",
]

[project.scripts]
sentinel = "src.cli:main"

[tool.setuptools]
packages = ["src", "src.parsers", "src.detection"]
